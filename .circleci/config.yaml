version: 2.1
orbs:
  node: circleci/node@5.1.1

jobs:
  build-site:
    machine:
      image: ubuntu-2004:202101-01
    resource_class: arm.medium
    steps:
    - setup
    - run:
        name: Login to GHCR
        command: |
          docker login ghcr.io -u $GH_USER -p $GH_TOKEN
    - run:
        name: Build multiarch docker image and push to GHCR
        command: |
          docker build -t simplysyncedllc_com/simplysyncedllc_website .
          docker push simplysyncedllc_com/simplysyncedllc_website

workflows:
  test_my_app:
    jobs:
    - build-site:
        context:
        - DOCKER_HUB
