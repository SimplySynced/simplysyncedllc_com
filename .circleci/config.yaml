version: 2.1
orbs:
  github-cli: circleci/github-cli@2.4.0

commands:
  setup:
    steps:
    - checkout
    - run:
        name: Update arm machine
        command: |
          sudo apt-get update

jobs:
  get-version:
  - name: Get version from package.json
    id: release
    run: |
      CURR_VER="$(cat package.json | jq -r .name)_v$(cat package.json | jq -r .version)"
      CURR_NAME="$(cat package.json | jq -r .name) v$(cat package.json | jq -r .version)"
      echo $CURR_VER

  create-release:
  - gh/release:
    tag: $CURR_VER

  build-and-deploy:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    steps:
    - setup
    - run:
        name: Login to GHCR
        command: |
          docker login ghcr.io -u $GH_USER -p $GH_TOKEN
    - run:
        name: Build multiarch docker image and push to GHCR
        command: |
          docker build -t ghcr.io/simplysynced/simplysyncedllc_website .
          docker push ghcr.io/simplysynced/simplysyncedllc_website

workflows:
  Build_and_Deploy:
    jobs:
    - get-version
    - create-release:
        context:
        - Github
    - build-and-deploy:
        context:
        - Github
